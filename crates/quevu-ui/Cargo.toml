[package]
name = "quevu-ui"
description = "The quevu visual part as a dynamic library with a C interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "quevu_ui"
crate-type = ["cdylib", "rlib"]

[dependencies]
quevu-ui-core = { path = "../quevu-ui-core" }

[target.'cfg(windows)'.dependencies]
quevu-ui-win32 = { path = "../quevu-ui-win32" }
